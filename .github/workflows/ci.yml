name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: biomejs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node
        uses: pnpm/setup@v3.1.2
        with:
          node-version-file: '.nvmrc'
          cache: true
          require-lockfile: true

      - run: pnpm lint:check

  test:
    name: vitest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node
        uses: pnpm/setup@v3.1.2
        with:
          node-version-file: '.nvmrc'
          cache: true
          require-lockfile: true

      - run: pnpm typecheck
      - run: pnpm test
