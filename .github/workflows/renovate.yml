name: Renovate

on:
  pull_request:
    paths:
      - renovate.json
      - renovate.json5
      - .github/workflows/renovate.yml
  push:
    paths:
      - renovate.json
      - renovate.json5
      - .github/workflows/renovate.yml

permissions: {}

jobs:
  validate:
    name: Config validation
    uses: setchy/renovate-config/.github/workflows/renovate-config-validator.yml@c9fbc8522f9b8723fc658d7707bc679e17206bf8 # main
    permissions:
      contents: read
