name: Renovate

on:
  pull_request:
    paths:
      - renovate.json
      - renovate.json5
      - .github/workflows/renovate.yml
  push:
    paths:
      - renovate.json
      - renovate.json5
      - .github/workflows/renovate.yml

permissions: {}

jobs:
  validate:
    name: Config validation
    uses: setchy/renovate-config/.github/workflows/renovate-config-validator.yml@3bbc4d6cd193fb97511fc26aa70ea3af4f6db092 # main
    permissions:
      contents: read
