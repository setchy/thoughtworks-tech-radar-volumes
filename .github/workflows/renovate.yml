name: Renovate

on:
  pull_request:
    paths:
      - renovate.json
      - renovate.json5
      - .github/workflows/renovate.yml
  push:
    paths:
      - renovate.json
      - renovate.json5
      - .github/workflows/renovate.yml

permissions: {}

jobs:
  validate:
    name: Config validation
    uses: setchy/renovate-config/.github/workflows/renovate-config-validator.yml@d5436415c7e51ee02b3dd68a9356ba26297e5e38 # main
    permissions:
      contents: read
