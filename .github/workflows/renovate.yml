name: Renovate

on:
  pull_request:
    paths:
      - renovate.json
      - renovate.json5
      - .github/workflows/renovate.yml
  push:
    paths:
      - renovate.json
      - renovate.json5
      - .github/workflows/renovate.yml

permissions: {}

jobs:
  validate:
    name: Config validation
    uses: setchy/renovate-config/.github/workflows/renovate-config-validator.yml@b16d4d6b2ed2cb3600994302a1fdc860ee942e83 # main
    permissions:
      contents: read
